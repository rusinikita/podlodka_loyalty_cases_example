[project]
name = "loyalty-e2e"
version = "1.0.0"
description = "Scenario tests of the loyalty service"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6,<3",
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pyyaml>=6.0,<7",
    "testcontainers>=4.8,<5",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
