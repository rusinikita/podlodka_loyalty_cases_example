openapi: 3.0.3
info:
  title: Antifraud Verdicts API
  version: 1.3.0
  description: |
    Verdicts of the antifraud service for referral rewards.

    The client sends rewards in batches and gets a verdict for each one.
    If a reward is not known to antifraud yet, a check is started and the
    verdict is `pending`; ask again later. A check usually takes a few hours.
    Requests are idempotent: the same reward always maps to the same check.

    Internal network only, service token required.
  contact:
    name: team-antifraud
    url: https://wiki.veter.tech/display/AF
servers:
  - url: http://antifraud.antifraud.svc.cluster.local
    description: production
  - url: http://antifraud.antifraud.stage.svc.cluster.local
    description: staging
security:
  - serviceToken: []
paths:
  /v1/referral-rewards/verdicts:
    post:
      operationId: getReferralRewardVerdicts
      summary: Get verdicts for a batch of referral rewards
      description: Up to 500 rewards per request. Items in the response follow the order of the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, items]
              properties:
                source:
                  type: string
                  description: Calling service name.
                  example: loyalty
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/RewardCheck' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Verdict' }
              example:
                items:
                  - reward_id: 10498112
                    verdict: approved
                    checked_at: '2026-10-20T09:14:02Z'
                  - reward_id: 10498113
                    verdict: rejected
                    reason: device_shared_with_inviter
                    checked_at: '2026-10-20T09:14:02Z'
                  - reward_id: 10498114
                    verdict: pending
        '400':
          description: Invalid request, e.g. more than 500 items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Client rate limit exceeded
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Service temporarily unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
  schemas:
    RewardCheck:
      type: object
      required: [reward_id, inviter_id, invitee_id, amount, currency, created_at]
      properties:
        reward_id: { type: integer, format: int64 }
        inviter_id: { type: integer, format: int64 }
        invitee_id: { type: integer, format: int64 }
        amount: { type: integer, description: In major currency units }
        currency: { type: string, example: RUB }
        created_at: { type: string, format: date-time }
    Verdict:
      type: object
      required: [reward_id, verdict]
      properties:
        reward_id: { type: integer, format: int64 }
        verdict:
          type: string
          enum: [approved, rejected, pending]
        reason:
          type: string
          nullable: true
          description: Only for `rejected`.
        checked_at:
          type: string
          format: date-time
          nullable: true
          description: When the verdict was made. Null for `pending`.
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
