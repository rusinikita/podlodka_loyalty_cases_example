[project]
name = "loyalty"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.11,<1",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "structlog>=24.4",
    "uvicorn>=0.32,<1",
]

[project.scripts]
loyalty = "loyalty.main:main"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^e2e/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
